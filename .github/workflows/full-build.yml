name: Full host builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-host-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosts:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.hosts.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: accept-flake-config = true
      - id: hosts
        run: printf 'matrix=%s\n' "$(nix eval --json --no-write-lock-file .#lib.buildMatrix)" >> "$GITHUB_OUTPUT"

  host-build:
    needs: hosts
    runs-on: ${{ matrix.platform == 'darwin' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.hosts.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        if: matrix.platform == 'nixos'
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/lib/jvm \
            /usr/local/julia* \
            /usr/local/lib/node_modules \
            /usr/local/share/chromium \
            /usr/local/share/boost \
            /usr/local/share/vcpkg \
            /opt/microsoft \
            /opt/google \
            /opt/az \
            /usr/local/aws-cli
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          docker system prune -af || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo mkdir -p /mnt/nix-build
          sudo chmod 0755 /mnt/nix-build

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            accept-flake-config = true
            build-dir = ${{ matrix.platform == 'darwin' && '/private/tmp/nix-build' || '/mnt/nix-build' }}
            auto-optimise-store = true

      - name: Prepare Darwin build directory
        if: matrix.platform == 'darwin'
        run: sudo install -d -m 0755 /private/tmp/nix-build

      - name: Build NixOS system
        if: matrix.platform == 'nixos'
        run: nix build --max-jobs 1 --cores 2 --no-link --print-build-logs --no-write-lock-file .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
      - name: Build Darwin system
        if: matrix.platform == 'darwin'
        run: nix build --max-jobs 1 --cores 2 --no-link --print-build-logs --no-write-lock-file .#darwinConfigurations.${{ matrix.host }}.system

      - name: Build Home Manager
        if: matrix.home
        run: nix build --max-jobs 1 --cores 2 --no-link --print-build-logs --no-write-lock-file '.#homeConfigurations."${{ matrix.username }}@${{ matrix.host }}".activationPackage'

      - name: Disk usage
        if: always()
        run: |
          df -h / || true
          sudo du -sh /nix/store 2>/dev/null || true
          sudo du -sh "${{ matrix.platform == 'darwin' && '/private/tmp/nix-build' || '/mnt/nix-build' }}" 2>/dev/null || true

  darwin-foundation:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: accept-flake-config = true
      - name: Confirm Apple Silicon builder
        run: test "$(uname -m)" = arm64
      - name: Evaluate all platforms without activation
        run: nix flake check --all-systems --no-build --no-write-lock-file
      - name: Build Darwin system, Home and AI fixtures
        run: nix flake check --no-write-lock-file --max-jobs 1 --cores 2
      - name: Ensure flake.lock is unchanged
        run: git diff --exit-code -- flake.lock

  full-build-gate:
    if: always()
    needs: [hosts, host-build, darwin-foundation]
    runs-on: ubuntu-latest
    steps:
      - name: Require all inventory builds
        env:
          HOSTS_RESULT: ${{ needs.hosts.result }}
          BUILDS_RESULT: ${{ needs.host-build.result }}
          DARWIN_RESULT: ${{ needs.darwin-foundation.result }}
        run: test "$HOSTS_RESULT" = success && test "$BUILDS_RESULT" = success && test "$DARWIN_RESULT" = success
