name: Nixfmt probe

on:
  pull_request:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/nixfmt-tailscale-probe
      - uses: cachix/install-nix-action@v31
      - name: Persist canonical nixfmt output
        shell: bash
        run: |
          nix fmt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flake.nix profiles/home/fleet-access.nix
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: probe nixfmt output'
          git push origin HEAD:agent/nixfmt-tailscale-probe
