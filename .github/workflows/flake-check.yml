name: Nixfmt probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Show canonical nixfmt output
        shell: bash
        run: |
          nix fmt
          echo '__FLAKE_BEGIN__'
          cat flake.nix
          echo '__FLAKE_END__'
          echo '__FLEET_ACCESS_BEGIN__'
          cat profiles/home/fleet-access.nix
          echo '__FLEET_ACCESS_END__'
          exit 1
