name: Flake checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: nix run .#gitleaks -- git --redact --no-banner
      - run: nix fmt -- --ci
      - run: nix flake check --no-build --no-write-lock-file
      - run: nix build --no-link --no-write-lock-file .#checks.x86_64-linux.nix-config .#checks.x86_64-linux.opencode-workflow
      - run: node --check opencode/plugins/rtk.js
      - run: jq empty opencode/opencode.json
      - run: jq empty opencode/kiro-models.json
      - run: git diff --exit-code -- flake.lock
      - id: hosts
        run: printf 'hosts=%s\n' "$(nix eval --json .#lib.workstationNames)" >> "$GITHUB_OUTPUT"

  host-build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.check.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        shell: bash
        run: |
          echo "=== Disk before cleanup ==="
          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          docker system prune -af || true

          echo "=== Disk after cleanup ==="
          df -h

      - uses: cachix/install-nix-action@v31

      - name: Disk space before NixOS build
        run: df -h

      - name: Build NixOS system
        run: nix build --no-link --no-write-lock-file .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel

      - name: Build Home Manager
        run: nix build --no-link --no-write-lock-file '.#homeConfigurations."anthony@${{ matrix.host }}".activationPackage'

      - name: Disk usage
        if: always()
        shell: bash
        run: |
          echo "=== Final filesystem usage ==="
          df -h
          echo "=== Nix store usage ==="
          sudo du -sh /nix/store 2>/dev/null || true
