name: Nixfmt probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Show canonical nixfmt diff
        shell: bash
        run: |
          nix fmt
          git --no-pager diff -- modules/system/syncthing-fleet.nix
          exit 1
