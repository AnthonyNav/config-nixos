name: Nixfmt probe

on:
  pull_request:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/nixfmt-opencode-remote-probe
      - uses: cachix/install-nix-action@v31
      - name: Persist canonical nixfmt output
        shell: bash
        run: |
          set -euo pipefail
          nix fmt
          git config user.name "nixfmt-probe"
          git config user.email "nixfmt-probe@users.noreply.github.com"
          git add \
            modules/home/opencode-remote.nix \
            modules/system/opencode-remote.nix \
            modules/system/tailscale-fleet.nix
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: capture remote opencode nixfmt"
          git push origin HEAD:agent/nixfmt-opencode-remote-probe
