name: Flake checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flake-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Scan for secrets
        run: nix run .#gitleaks -- git --redact --no-banner
      - name: Check formatting
        run: nix fmt -- --ci
      - name: Evaluate and build all flake checks
        run: nix flake check --no-write-lock-file
      - name: Check OpenCode plugin syntax
        run: node --check opencode/plugins/rtk.js
      - name: Validate OpenCode JSON
        run: |
          jq empty opencode/opencode.json
          jq empty opencode/kiro-models.json
      - name: Ensure flake.lock is unchanged
        run: git diff --exit-code -- flake.lock

  hosts:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.hosts.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - id: hosts
        run: printf 'matrix=%s\n' "$(nix eval --json --no-write-lock-file .#lib.workstationNames)" >> "$GITHUB_OUTPUT"

  plan-host-build:
    needs: hosts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.hosts.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Plan NixOS system build
        run: nix build --dry-run --no-link --no-write-lock-file .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
      - name: Plan Home Manager activation build
        run: nix build --dry-run --no-link --no-write-lock-file '.#homeConfigurations."anthony@${{ matrix.host }}".activationPackage'
