name: Flake checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flake-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Scan for secrets
        run: nix run .#gitleaks -- git --redact --no-banner
      - name: Check formatting
        run: nix fmt -- --ci
      - name: Evaluate flake checks
        run: nix flake check --no-build --no-write-lock-file
      - name: Build repository checks
        run: nix build --no-link --no-write-lock-file .#checks.x86_64-linux.nix-config .#checks.x86_64-linux.opencode-workflow
      - name: Check OpenCode plugin syntax
        run: node --check opencode/plugins/rtk.js
      - name: Validate OpenCode JSON
        run: |
          jq empty opencode/opencode.json
          jq empty opencode/kiro-models.json
      - name: Ensure flake.lock is unchanged
        run: git diff --exit-code -- flake.lock
