# Shared prompt; credentials and runtime state do not belong here.
add_newline = false
format = "$directory$git_branch$git_status$python$conda$nodejs$golang$nix_shell$cmd_duration$line_break$character"

[character]
error_symbol = "[❯](bold #f38ba8)"
success_symbol = "[❯](bold #a6e3a1)"

[cmd_duration]
format = "[⏱ $duration ]($style)"
min_time = 2000
style = "bold #fab387"

[conda]
format = "[$symbol$environment ]($style)"
ignore_base = false
style = "bold #a6e3a1"
symbol = "󱔎 "

[directory]
read_only = " 󰌾"
style = "bold #89b4fa"
truncate_to_repo = true

[git_branch]
format = "on [$symbol$branch]($style) "
style = "bold #cba6f7"
symbol = " "

[git_status]
ahead = "⇡$count"
behind = "⇣$count"
deleted = "✘$count"
diverged = "⇕⇡$ahead_count⇣$behind_count"
modified = "!$count"
staged = "+$count"
style = "bold #f38ba8"
untracked = "?$count"

[golang]
detect_extensions = ["go"]
detect_files = ["go.mod","go.sum"]
format = "[$symbol$version ]($style)"
style = "bold #89dceb"
symbol = " "

[nix_shell]
format = "[$symbol$name ]($style)"
impure_msg = "[impure](#fab387)"
pure_msg = "[pure](#a6e3a1)"
style = "bold #74c7ec"
symbol = " "

[nodejs]
detect_extensions = ["js","ts","mjs","cjs"]
detect_files = ["package.json",".nvmrc",".node-version"]
format = "[$symbol$version ]($style)"
style = "bold #a6e3a1"
symbol = " "

[python]
detect_extensions = ["py"]
detect_files = [".python-version","requirements.txt","pyproject.toml","setup.py","Pipfile"]
format = "[$symbol($virtualenv )]($style)"
style = "bold #f9e2af"
symbol = " "
